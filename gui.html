<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="session-token" content="{{TOKEN}}">
  <title>PDF 去水印</title>
  <link rel="stylesheet" href="gui.css">
  <script src="gui.js" defer></script>
</head>
<body>
  <main>
    <header><span class="wordmark">PDF / CLEAN</span><span class="local"><i></i> 本机处理</span></header>
    <section class="intro"><span class="eyebrow">让内容清晰呈现</span><h1>PDF 去水印</h1><p>拖入文件，一键去除独立水印并保存。</p></section>
    <section class="card" aria-label="PDF 处理">
      <input type="file" id="file" accept=".pdf,application/pdf" hidden>
      <button type="button" id="drop" class="drop" aria-label="选择或拖入 PDF">
        <span class="file-icon" aria-hidden="true">PDF<span>↓</span></span>
        <strong id="file-name">将 PDF 拖到这里</strong>
        <span id="file-size">或点击选择文件 · 最大 100 MB</span>
      </button>
      <div class="actions"><button id="clean" class="primary" disabled>去水印并保存 <span aria-hidden="true">↗</span></button></div>
      <div id="status" class="status" role="status" aria-live="polite">准备好后，选择一份 PDF 开始。</div>
      <a id="download" class="download" hidden>再次保存处理结果</a>
      <details id="advanced"><summary>高级选项</summary>
        <div class="fields">
          <label>处理页码 <input id="pages" placeholder="全部页面，如 1,3-5"></label>
          <label>水印对象名 <input id="xobject" placeholder="留空自动识别，如 X136"></label>
          <label>Pattern 名称 <input id="pattern" placeholder="可选，如 P1"></label>
          <label class="check"><input type="checkbox" id="annotations"> 删除 Watermark 注释</label>
        </div>
        <p class="hint">指定对象或 Pattern 后只删除指定内容；请确认对象中没有正文。</p>
        <button id="inspect" class="secondary" disabled>查看识别结果</button>
        <div id="inventory" hidden></div>
      </details>
    </section>
    <footer><p>原文件保持不变。处理结果按浏览器的下载设置保存。</p><p>适用于可分离的透明图片、Form 或 Pattern 水印；扫描图片中的水印不适用。</p></footer>
  </main>
</body>
</html>
